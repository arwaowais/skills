<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0}</style><title>تحدي المهارات</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Lalezar&display=swap">
<style>
/* Layout: one "mission console" column. A sticky status bar carries the group, five stamps and the score; one task card at a time below it; large tap targets sized for a shared tablet. Palette is taken from the textbook page itself: sky blue tab, plum pill, yellow highlighter. */
:root{
  --bg:#EAF1FA; --surface:#FFFFFF; --surface-2:#F2F6FC; --ink:#24224F; --muted:#586088; --line:#D2DDEE;
  --brand:#2F74C0; --on-brand:#FFFFFF; --plum:#8B3F95; --on-plum:#FFFFFF;
  --hl:#FFE24A; --hl-ink:#3A3200;
  --good:#17805A; --good-bg:#DCF3E9; --bad:#C23A3A; --bad-bg:#FBE2E0;
  --shadow:0 1px 0 rgba(36,34,79,.06),0 10px 28px -14px rgba(36,34,79,.35);
  --g1:#2F74C0; --g2:#8B3F95; --g3:#17806F; --g4:#B8641A; --g5:#C23A63; --g6:#5E7F1E;
  --f-display:'Lalezar','IBM Plex Sans Arabic',Tahoma,sans-serif;
  --f-body:'IBM Plex Sans Arabic',Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12122A; --surface:#1C1C3E; --surface-2:#25254D; --ink:#EEEDFF; --muted:#A8ACD6; --line:#35356A;
  --brand:#6FAAEE; --on-brand:#0D0F2E; --plum:#C27BCC; --on-plum:#1A0D1E;
  --good:#52D3A0; --good-bg:#14382C; --bad:#FF8A84; --bad-bg:#432024;
  --shadow:0 10px 28px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12122A; --surface:#1C1C3E; --surface-2:#25254D; --ink:#EEEDFF; --muted:#A8ACD6; --line:#35356A;
  --brand:#6FAAEE; --on-brand:#0D0F2E; --plum:#C27BCC; --on-plum:#1A0D1E;
  --good:#52D3A0; --good-bg:#14382C; --bad:#FF8A84; --bad-bg:#432024;
  --shadow:0 10px 28px -14px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:500 18px/1.7 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.3;text-wrap:balance}
.hl{background:var(--hl);color:var(--hl-ink);padding:0 .28em;border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
#shell{max-width:980px;margin:0 auto}

/* status bar */
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 0;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-size:1.55rem;line-height:1;margin-inline-end:auto;white-space:nowrap}
.gchip{display:inline-flex;align-items:center;gap:8px;background:var(--gc,var(--brand));color:#fff;border-radius:999px;padding:4px 16px;font-weight:700;font-size:.95rem;white-space:nowrap}
.stamps{display:flex;gap:8px}
.stamp{width:34px;height:34px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted);transition:transform .25s}
.stamp svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stamp.done{background:var(--good);border:2px solid var(--good);color:#fff}
.stamp.cur{border:2px solid var(--brand);color:var(--brand);background:var(--surface)}
.score{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.score b{font-family:var(--f-display);font-weight:400;font-size:1.5rem;margin-inline-start:4px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav{display:flex;gap:6px}
.nav a{padding:6px 16px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600}
.nav a[aria-current="page"]{background:var(--brand);color:var(--on-brand)}

/* cards & buttons */
#stage{padding-top:22px;display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow);min-width:0}
.eyebrow{font-size:.85rem;font-weight:700;letter-spacing:.04em;color:var(--plum);margin-bottom:2px}
.lead{color:var(--muted)}
.btn{border:0;border-radius:14px;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:1.1rem;padding:14px 28px;min-height:56px;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.plum{background:var(--plum);color:var(--on-plum)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.row.end{justify-content:flex-end}

/* welcome */
.hero{display:grid;gap:10px;padding:6px 0 4px}
.hero h1{font-size:clamp(2.6rem,9vw,4.6rem);line-height:1.15}
.hero .lead{font-size:1.15rem;max-width:34em}
.pick{display:grid;gap:10px}
.pick h3{font-size:1.25rem}
.gpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.gbtn{border:2px solid var(--line);background:var(--surface-2);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;text-align:start;font-weight:700;min-height:60px}
.gbtn i{width:22px;height:22px;border-radius:50%;background:var(--gc);flex:none}
.gbtn small{display:block;font-weight:500;color:var(--muted);line-height:1.3}
.gbtn[aria-pressed="true"]{border-color:var(--gc);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--gc) 30%,transparent)}
.seg{display:flex;gap:10px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:var(--surface-2);border-radius:14px;padding:10px 22px;font-weight:700;min-width:110px;min-height:52px}
.seg button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--on-brand)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.rule{background:var(--surface-2);border-radius:14px;padding:14px 16px}
.rule b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.25rem}
.rule span{color:var(--muted);font-size:.95rem;line-height:1.5;display:block}
.resume{border:2px solid var(--hl);background:color-mix(in srgb,var(--hl) 16%,var(--surface))}

/* briefing */
.brief{display:grid;gap:18px}
.brief h2{font-size:clamp(1.9rem,6vw,2.8rem)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.roles{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.roles li{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:12px;padding:8px 14px}
.roles .no{width:34px;height:34px;border-radius:50%;background:var(--gc);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.roles li.main{outline:3px solid var(--hl)}
.roles em{font-style:normal;color:var(--muted);font-size:.9rem;margin-inline-start:auto}
.facts{display:flex;flex-wrap:wrap;gap:10px}
.fact{background:var(--surface-2);border-radius:12px;padding:8px 14px;font-size:.95rem}
.fact b{font-variant-numeric:tabular-nums}

/* mission */
.mhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.mhead h2{font-size:clamp(1.6rem,5vw,2.2rem)}
.timer{position:relative;min-width:120px;background:var(--surface-2);border-radius:14px;padding:6px 16px 10px;text-align:center;overflow:hidden;font-variant-numeric:tabular-nums}
.timer span{font-weight:700;font-size:1.3rem}
.timer i{position:absolute;inset:auto 0 0 auto;height:5px;width:0;background:var(--brand);transition:width .25s linear}
.timer.late i{background:var(--bad)}
.timer small{display:block;color:var(--muted);font-size:.78rem;line-height:1}
.qprog{display:flex;gap:6px;margin-bottom:16px}
.qprog i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.qprog i.ok{background:var(--good)} .qprog i.no{background:var(--bad)} .qprog i.now{background:var(--brand)}
.qcard{background:var(--surface-2);border-radius:18px;padding:22px;text-align:center;display:grid;gap:6px;min-height:130px;align-content:center}
.qlabel{color:var(--plum);font-weight:700;font-size:.9rem}
.qtext{font-size:clamp(1.25rem,3.6vw,1.65rem);line-height:1.6;font-weight:600;text-wrap:balance}
.opts{display:grid;gap:12px;margin-top:16px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.four{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:16px;min-height:68px;padding:12px 16px;font-weight:700;font-size:1.15rem;transition:transform .12s,background .15s,border-color .15s}
.opt:active{transform:scale(.98)}
.opt.tf-t{border-color:var(--good)} .opt.tf-f{border-color:var(--bad)}
.opt.ok{background:var(--good-bg);border-color:var(--good);color:var(--ink)}
.opt.no{background:var(--bad-bg);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.fb{margin-top:16px;border-radius:16px;padding:16px 20px;display:grid;gap:10px}
.fb.ok{background:var(--good-bg)} .fb.no{background:var(--bad-bg)}
.fb b{font-family:var(--f-display);font-weight:400;font-size:1.3rem}
.fb p{line-height:1.6}

/* cloze */
.cloze{font-size:clamp(1.25rem,3.4vw,1.6rem);line-height:2.6;background:var(--surface-2);border-radius:18px;padding:18px 22px;text-wrap:pretty}
.blank{display:inline-flex;align-items:center;justify-content:center;min-width:5.2em;height:2.1em;border:0;border-bottom:3px dashed var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent);border-radius:8px 8px 0 0;font-weight:700;padding:0 10px;vertical-align:middle;margin-inline:4px}
.blank.full{border-bottom-style:solid;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.blank.ok{background:var(--good-bg);border-bottom-color:var(--good);border-bottom-style:solid}
.blank.no{background:var(--bad-bg);border-bottom-color:var(--bad);border-bottom-style:solid}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;justify-content:center}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 20px;min-height:50px;font-weight:700;font-size:1.1rem;transition:transform .12s}
.chip:active{transform:scale(.96)}
.chip.sel{background:var(--hl);color:var(--hl-ink);border-color:var(--hl)}
.chip[disabled]{opacity:.28;cursor:default}

/* tree */
.tree{display:grid;gap:14px;justify-items:center}
.root{background:var(--plum);color:var(--on-plum);font-family:var(--f-display);font-size:1.5rem;padding:6px 34px;border-radius:999px}
.branches{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;position:relative}
.branches::before{content:"";position:absolute;inset:-14px 25% auto 25%;height:14px;border:2px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0}
.branch{background:var(--surface-2);border-radius:18px;padding:14px;display:grid;gap:10px}
.btitle{display:flex;align-items:center;gap:10px;font-weight:700;background:color-mix(in srgb,var(--plum) 16%,var(--surface));border-radius:999px;padding:6px 14px 6px 8px}
.btitle .n{width:32px;height:32px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;flex:none;font-weight:700}
.slot{min-height:56px;border:2px dashed var(--line);border-radius:14px;background:var(--surface);font-weight:700;color:var(--muted);display:grid;place-items:center;padding:6px 10px}
.slot.full{border-style:solid;color:var(--ink)}
.slot.ok{background:var(--good-bg);border:2px solid var(--good);color:var(--ink)}
.slot.no{background:var(--bad-bg);border:2px solid var(--bad);color:var(--ink)}
.slot.ready{border-color:var(--hl);background:color-mix(in srgb,var(--hl) 20%,var(--surface))}

/* result & finish */
.big{font-family:var(--f-display);font-size:clamp(3rem,12vw,5.5rem);line-height:1}
.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface-2);border-radius:16px;padding:14px 16px}
.tile small{display:block;color:var(--muted);font-weight:600}
.tile b{font-family:var(--f-display);font-weight:400;font-size:1.9rem;line-height:1.2;font-variant-numeric:tabular-nums}
.nugget{border-inline-start:6px solid var(--hl);background:var(--surface-2);border-radius:12px;padding:14px 18px}
.nugget b{display:block;font-size:.85rem;color:var(--plum);letter-spacing:.04em}
.codebox{background:var(--surface-2);border-radius:14px;padding:12px 16px;display:grid;gap:2px}
.codebox small{color:var(--muted);font-weight:600}
.codebox b{font:700 clamp(1.15rem,4.4vw,1.7rem)/1.4 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;direction:ltr;text-align:start;unicode-bidi:isolate;overflow-wrap:anywhere}
.codein{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.codein input{flex:1;min-width:230px;font:700 1.25rem ui-monospace,Menlo,Consolas,monospace;direction:ltr;text-align:start;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:12px 14px;min-height:56px;letter-spacing:.05em}
.reporter{background:color-mix(in srgb,var(--plum) 14%,var(--surface));border-radius:14px;padding:12px 16px}
.field{display:grid;gap:6px}
.field label{font-weight:700}
.field input,.field textarea{font:inherit;font-size:1.05rem;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:12px 14px;width:100%}
.cert{position:relative;overflow:hidden;border:2px solid var(--gc);text-align:center;display:grid;gap:14px;justify-items:center}
.cert::before{content:"";position:absolute;inset:10px;border:1px dashed var(--line);border-radius:14px;pointer-events:none}
.cert h2{font-size:clamp(2rem,7vw,3rem)}
.cert .stamps{flex-wrap:wrap;justify-content:center}
.cert .stamp{width:52px;height:52px}
.cert .stamp svg{width:26px;height:26px}
.ex{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;width:100%;text-align:start}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}

/* teacher */
.board{display:grid;gap:10px}
.brow{display:grid;grid-template-columns:40px 1fr auto;gap:10px 14px;align-items:center;background:var(--surface-2);border-radius:16px;padding:12px 16px;border-inline-start:8px solid var(--gc)}
.rank{font-family:var(--f-display);font-size:1.7rem;color:var(--muted);text-align:center}
.brow h3{font-size:1.3rem}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--gc);width:0;transition:width .3s}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ctl button{border:2px solid var(--line);background:var(--surface);border-radius:12px;min-width:48px;min-height:48px;font-weight:700;padding:0 10px}
.ctl input{width:86px;min-height:48px;text-align:center;font:700 1.4rem var(--f-display);border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{font-size:.85rem;color:var(--muted);letter-spacing:.03em}
.scroll{overflow-x:auto}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
ul.tidy{margin:8px 0 0;padding-inline-start:1.3em;display:grid;gap:4px}
#foot{text-align:center;color:var(--muted);font-size:.9rem;padding:26px 0 0}
#foot a{color:var(--muted)}

@media (max-width:560px){
  body{font-size:17px}
  .card{padding:18px}
  .opts.two{grid-template-columns:1fr 1fr}
  .branches{grid-template-columns:1fr}.branches::before{display:none}
  .brow{grid-template-columns:34px 1fr}
  .ctl{grid-column:1/-1;justify-content:flex-start}
  .brand{font-size:1.3rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head><body><div id="shell" dir="rtl" lang="ar">
  <header id="bar"></header>
  <main id="stage"></main>
  <footer id="foot"></footer>
</div>

<script>
(function(){
'use strict';
document.documentElement.setAttribute('dir','rtl');
document.documentElement.setAttribute('lang','ar');

/* ---------- helpers ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var mem={};
var store={
  get:function(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):(mem[k]||null)}catch(e){return mem[k]||null}},
  set:function(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del:function(k){delete mem[k];try{localStorage.removeItem(k)}catch(e){}}
};
var SKEY='skills-challenge-session-v1', TKEY='skills-challenge-board-v1';
var RKEY='skills-challenge-room-v1';
var dbp=null, wchain=Promise.resolve(), syncState='idle';
function getDb(){
  if(!dbp) dbp=(window.claude&&window.claude.use)?window.claude.use('db').catch(function(){return null}):Promise.resolve(null);
  return dbp;
}
function renderSync(){
  var el=document.getElementById('sync'); if(!el)return;
  var m={idle:'',ok:'وصلت نتيجتكنّ إلى لوحة المعلّمة. الرمز أدناه نسخة احتياطية.',off:'اقرأن الرمز أدناه للمعلّمة لتدخله في لوحتها.',fail:'تعذّر الإرسال. اقرأن الرمز أدناه للمعلّمة.'};
  el.textContent=m[syncState]||'';
}
/* result code: group(1) missions-done(1) 5x[points(2)+bonus(1)] checksum(2) = 19 digits */
function pad(n,w){n=String(n);while(n.length<w)n='0'+n;return n}
function chk(body){var t=0;for(var i=0;i<body.length;i++)t+=(+body[i])*(i+3);return pad(t%97,2)}
function makeCode(){
  var b=String(G.g+1)+String(Math.min(5,G.mi));
  for(var i=0;i<5;i++) b+=pad(G.pts[i]||0,2)+String(G.bonus[i]||0);
  var c=b+chk(b);
  return c.replace(/(\d{4})(?=\d)/g,'$1 ');
}
function decodeCode(raw){
  var d=String(raw).replace(/[\u0660-\u0669]/g,function(ch){return String(ch.charCodeAt(0)-1632)}).replace(/\D/g,'');
  if(d.length!==19)return null;
  var body=d.slice(0,17);
  if(chk(body)!==d.slice(17))return null;
  var g=+d[0], mi=+d[1]; if(g<1||g>GROUPS.length||mi>5)return null;
  var pts=[],bonus=[],tot=0;
  for(var i=0;i<5;i++){var o=2+i*3; if(i<mi){var pp=+d.slice(o,o+2),bb=+d[o+2];pts.push(pp);bonus.push(bb);tot+=pp+bb}}
  return {g:g-1,name:GROUPS[g-1].name,mi:mi,pts:pts,bonus:bonus,secs:[],total:tot,done:mi>=5,ex:null,ts:Date.now()};
}
function codeHTML(){return '<div class="codebox"><small>رمز النتيجة للمعلّمة</small><b>'+makeCode()+'</b></div>'}
function push(){

  var doc={g:G.g,name:GROUPS[G.g].name,size:G.size,mi:G.mi,pts:G.pts.slice(),bonus:G.bonus.slice(),secs:G.secs.slice(),

/* ---------- mission: quiz ---------- */
function quiz(body,cfg,done){
  var i=0, score=0, n=cfg.items.length, marks=[];
  function dots(){var s='';for(var k=0;k<n;k++)s+='<i class="'+(marks[k]||(k===i?'now':''))+'"></i>';return s}
  function show(){
    var it=cfg.items[i];
    body.innerHTML='<div class="qprog" aria-label="التقدّم">'+dots()+'</div>'+
      '<div class="qcard"><p class="qlabel">'+cfg.label+' ('+(i+1)+' من '+n+')</p><p class="qtext">'+it.q+'</p></div>'+
      '<div class="opts '+cfg.cls+'">'+it.opts.map(function(o,k){return '<button class="opt'+(cfg.tf?(k===0?' tf-t':' tf-f'):'')+'" data-k="'+k+'">'+o+'</button>'}).join('')+'</div><div id="fb"></div>';
    $$('.opt',body).forEach(function(b){b.onclick=function(){pick(+b.dataset.k)}});
  }
  function pick(k){
    var it=cfg.items[i], ok=(k===it.a);
    $$('.opt',body).forEach(function(b){
      b.disabled=true; var j=+b.dataset.k;
      if(j===it.a) b.classList.add('ok'); else if(j===k) b.classList.add('no');
    });
    if(ok){score+=MAXPTS/n;marks[i]='ok';sfx.ok()}else{marks[i]='no';sfx.bad()}
    $('.qprog',body).innerHTML=dots();
    var lastQ=(i===n-1);
    $('#fb').innerHTML='<div class="fb '+(ok?'ok':'no')+'"><b>'+(ok?'أحسنتنّ!':'ليست دقيقة')+'</b><p>'+it.why+'</p><div class="row end"><button class="btn" id="nx">'+(lastQ?'إنهاء المهمة':'التالي')+'</button></div></div>';
    $('#nx').onclick=function(){ if(lastQ){done(score)}else{i++;show()} };
    $('#nx').scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  show();
}

/* ---------- mission: cloze ---------- */
function cloze(body,done){
  var parts=[
    'المهارة هي القدرة ',{w:'المكتسبة'},' على أداء مهمة معيّنة أو عمل محدد ',{w:'ببراعة'},' ودقة وسرعة و',{w:'كفاءة'},
    '، باستخدام أقل قدر من ',{w:'الجهد'},' والطاقة؛ لتحقيق ',{w:'نتائج'},' محددة.'
  ];
  var answers=parts.filter(function(p){return typeof p!=='string'}).map(function(p){return p.w});
  var bank=shuffle(answers.concat(['الفطرية','بتردّد','المال','أخطاء']));
  var fill=answers.map(function(){return -1}), lock=answers.map(function(){return false}), flag=answers.map(function(){return ''});
  var attempt=1, score=0, finished=false;
  function sentence(){
    var k=-1;
    return parts.map(function(p){
      if(typeof p==='string') return esc(p);
      k++; var s=fill[k], cls='blank'+(s>=0?' full':'')+(flag[k]?' '+flag[k]:'');
      return '<button class="'+cls+'" data-s="'+k+'"'+(lock[k]||finished?' disabled':'')+'>'+(s>=0?bank[s]:'&nbsp;')+'</button>';
    }).join('');
  }
  function draw(msg){
    var allFilled=fill.every(function(x){return x>=0});
    body.innerHTML='<p class="lead" style="margin-bottom:10px">المحاولة '+attempt+' من 2'+(attempt===2?' · كل إجابة صحيحة الآن بنصف النقاط':'')+'</p>'+
      '<div class="cloze">'+sentence()+'</div>'+
      '<div class="bank">'+bank.map(function(w,j){return '<button class="chip" data-w="'+j+'"'+(fill.indexOf(j)>=0||finished?' disabled':'')+'>'+w+'</button>'}).join('')+'</div>'+
      '<div id="fb">'+(msg||'')+'</div>'+
      (finished?'':'<div class="row end" style="margin-top:16px"><button class="btn" id="chk"'+(allFilled?'':' disabled')+'>تحقّقن</button></div>');
    $$('.chip',body).forEach(function(c){c.onclick=function(){
      var s=fill.findIndex(function(x,q){return x<0&&!lock[q]}); if(s<0)return;
      fill[s]=+c.dataset.w; flag[s]=''; draw();
    }});
    $$('.blank',body).forEach(function(b){b.onclick=function(){
      var s=+b.dataset.s; if(fill[s]>=0&&!lock[s]){fill[s]=-1;flag[s]='';draw()}
    }});
    var chk=$('#chk',body); if(chk) chk.onclick=check;
    var nx=$('#nx',body); if(nx) nx.onclick=function(){done(score)};
  }
  function check(){
    var wrong=0, right=0;
    answers.forEach(function(a,k){
      if(lock[k])return;
      if(bank[fill[k]]===a){flag[k]='ok';lock[k]=true;right++;score+=(attempt===1?4:2)}else{flag[k]='no';wrong++}
    });
    if(wrong===0){finished=true;sfx.ok();draw('<div class="fb ok"><b>تعريف كامل وصحيح!</b><p>القدرة المكتسبة، وبراعة ودقة وسرعة وكفاءة، وأقل جهد وطاقة، ونتائج محددة.</p><div class="row end"><button class="btn" id="nx">إنهاء المهمة</button></div></div>');return}
    sfx.bad();
    if(attempt===1){
      draw('<div class="fb no"><b>تبقّى '+wrong+' فراغ'+(wrong>2?'ات':'')+' غير دقيق'+(wrong>1?'ة':'')+'</b><p>ثبّتنا الإجابات الصحيحة. أعدن التفكير في الباقي: لديكنّ محاولة أخيرة.</p><div class="row end"><button class="btn" id="retry">إعادة المحاولة</button></div></div>');
      $('#retry',body).onclick=function(){attempt=2;answers.forEach(function(_,k){if(!lock[k]){fill[k]=-1;flag[k]=''}});draw()};
    }else{
      answers.forEach(function(a,k){if(!lock[k]){fill[k]=bank.indexOf(a);flag[k]='ok';lock[k]=true}});
      finished=true;
      draw('<div class="fb no"><b>الإجابة الصحيحة ظاهرة أمامكنّ</b><p>اقرأن التعريف كاملًا بصوت مسموع قبل المتابعة.</p><div class="row end"><button class="btn" id="nx">إنهاء المهمة</button></div></div>');
    }
  }
  draw();
}

/* ---------- mission: tree ---------- */
function tree(body,done){
  var chips=shuffle([
    {t:'استخدام البرامج',b:0},{t:'المهارات اليدوية',b:0},{t:'المهارات اللغوية',b:0},
    {t:'التواصل',b:1},{t:'إدارة الوقت',b:1},{t:'حلّ المشكلات',b:1}
  ]);
  var slotB=[0,0,0,1,1,1], placed=[-1,-1,-1,-1,-1,-1], lock=[0,0,0,0,0,0], flag=['','','','','',''];
  var sel=-1, attempt=1, score=0, finished=false;
  function slotHTML(s){
    var c=placed[s], cls='slot'+(c>=0?' full':(sel>=0?' ready':''))+(flag[s]?' '+flag[s]:'');
    return '<button class="'+cls+'" data-s="'+s+'"'+(lock[s]||finished?' disabled':'')+'>'+(c>=0?chips[c].t:'اختاري مهارة')+'</button>';
  }
  function draw(msg){
    var all=placed.every(function(x){return x>=0});
    body.innerHTML='<p class="lead" style="margin-bottom:12px">المحاولة '+attempt+' من 2'+(attempt===2?' · كل إجابة صحيحة الآن بنصف النقاط':'')+'</p>'+
      '<div class="tree"><div class="root">أنواع المهارات</div><div class="branches">'+
      '<div class="branch"><div class="btitle"><span class="n">1</span>المهارات التقنية</div>'+slotHTML(0)+slotHTML(1)+slotHTML(2)+'</div>'+
      '<div class="branch"><div class="btitle"><span class="n">2</span>مهارات التعلّم للحياة</div>'+slotHTML(3)+slotHTML(4)+slotHTML(5)+'</div></div></div>'+
      '<div class="bank">'+chips.map(function(c,j){return '<button class="chip'+(sel===j?' sel':'')+'" data-c="'+j+'"'+(placed.indexOf(j)>=0||finished?' disabled':'')+'>'+c.t+'</button>'}).join('')+'</div>'+
      '<div id="fb">'+(msg||'')+'</div>'+
      (finished?'':'<div class="row end" style="margin-top:16px"><button class="btn" id="chk"'+(all?'':' disabled')+'>تحقّقن</button></div>');
    $$('.chip',body).forEach(function(c){c.onclick=function(){sel=(sel===+c.dataset.c)?-1:+c.dataset.c;draw()}});
    $$('.slot',body).forEach(function(b){b.onclick=function(){
      var s=+b.dataset.s;
      if(placed[s]>=0){placed[s]=-1;flag[s]='';draw();return}
      if(sel>=0){placed[s]=sel;sel=-1;flag[s]='';draw()}
    }});
    var chk=$('#chk',body); if(chk) chk.onclick=check;
    var nx=$('#nx',body); if(nx) nx.onclick=function(){done(score)};
  }
  function check(){
    var wrong=0;
    placed.forEach(function(c,s){
      if(lock[s])return;
      if(chips[c].b===slotB[s]){flag[s]='ok';lock[s]=1;score+=(attempt===1?MAXPTS/6:MAXPTS/12)}else{flag[s]='no';wrong++}
    });
    if(wrong===0){finished=true;sfx.ok();draw('<div class="fb ok"><b>شجرة مكتملة وصحيحة!</b><p>قارنّها بالشكل (1) في كتابكنّ.</p><div class="row end"><button class="btn" id="nx">إنهاء المهمة</button></div></div>');return}
    sfx.bad();
    if(attempt===1){
      draw('<div class="fb no"><b>هناك '+wrong+' في غير مكانها</b><p>ثبّتنا الصحيح. تذكّرن: أي النوعين يضمّ البرامج واليدوية واللغوية؟</p><div class="row end"><button class="btn" id="retry">إعادة المحاولة</button></div></div>');
      $('#retry',body).onclick=function(){attempt=2;placed.forEach(function(c,s){if(!lock[s]){placed[s]=-1;flag[s]=''}});draw()};
    }else{
      var pool={0:[],1:[]};
      chips.forEach(function(c,j){if(!lock_has(j))pool[c.b].push(j)});
      placed.forEach(function(c,s){if(!lock[s]){placed[s]=pool[slotB[s]].shift();flag[s]='ok';lock[s]=1}});
      finished=true;
      draw('<div class="fb no"><b>هذا هو الترتيب الصحيح</b><p>اقرأن الشجرة بصوت مسموع، ثم أكملن.</p><div class="row end"><button class="btn" id="nx">إنهاء المهمة</button></div></div>');
    }
  }
  function lock_has(j){return placed.some(function(c,s){return c===j&&lock[s]})}
  draw();
}

/* ---------- confetti ---------- */
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var cv=$('#fx'), ctx=cv.getContext('2d'); if(!ctx)return;
  var W=cv.width=innerWidth, H=cv.height=innerHeight, cols=['#FFE24A','#2F74C0','#8B3F95','#17806F','#C23A63','#E07B2E'];
  var ps=[];for(var i=0;i<110;i++)ps.push({x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[i%cols.length]});
  var t0=performance.now();
  (function f(now){
    ctx.clearRect(0,0,W,H);
    ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);ctx.restore()});
    if(now-t0<3200)requestAnimationFrame(f);else ctx.clearRect(0,0,W,H);
  })(t0);
}

    (dbOn?'':'<div class="codebox" style="margin:10px 0"><small>رقم الغرفة: اكتبيه على السبورة لتدخله كل مجموعة في صفحة البداية</small><b>'+roomCode()+'</b></div><div class="row" style="margin-bottom:6px"><button class="btn ghost" id="newroom">رقم غرفة جديد</button></div>')+
    '<p class="lead">'+((dbOn||apiOn)?'متّصلة: تصل النتائج تلقائيًا. يمكنك أيضًا إدخال رمز مجموعة.':'غير متّصلة بالخادم. اطلبي من كل مجموعة قراءة الرمز الظاهر على تابها بعد كل مهمة، وأدخليه هنا.')+'</p>'+
    '<div class="codein"><input id="codein" type="text" inputmode="numeric" autocomplete="off" placeholder="الصقي أو اكتبي الرمز المكوّن من 19 رقمًا" value="'+esc(oldv)+'"><button class="btn plum" id="codeadd">إضافة الرمز</button></div><p class="lead" id="codemsg" style="min-height:1.7em">'+esc(oldmsg)+'</p>'+rows+'</section>';
  var addCode=function(){
    var r=decodeCode($('#codein').value), msg=$('#codemsg');
    if(!r){msg.textContent='الرمز غير صحيح. تأكدي من الأرقام وأعيدي المحاولة.';sfx.bad();return}
    imported[r.g]=r; store.set(CKEY,imported); results[r.g]=r;
    $('#codein').value=''; drawBoard();
    $('#codemsg').textContent='أُضيفت نتيجة المجموعة '+GROUPS[r.g].n+': '+r.total+' نقطة بعد '+r.mi+' مهمات.';
  };
  $('#codeadd').onclick=addCode;
  var nr=$('#newroom'); if(nr) nr.onclick=function(){store.set(RKEY,String(1000+Math.floor(Math.random()*9000)));lastSig='';pollApi();drawBoard()};
  $('#codein').onkeydown=function(e){if(e.key==='Enter')addCode()};
  $$('.ctl button').forEach(function(b){b.onclick=function(){
    var g=+b.parentNode.dataset.g; setAdj(g,adj[g]+(+b.dataset.d));
  }});
  var rs=$('#reset'), armed=false;
  rs.onclick=function(){
    if(!armed){armed=true;rs.textContent='اضغطي مرة أخرى للتأكيد';setTimeout(function(){armed=false;if($('#reset'))$('#reset').textContent='تصفير اللوحة'},3500);return}
    adj=GROUPS.map(function(){return 0}); store.set(TKEY,adj); imported={}; store.del(CKEY); results={};
    if(!dbOn&&apiOn) fetch('/api/sync?room='+encodeURIComponent(roomCode()),{method:'DELETE'}).catch(function(){});
    if(dbOn) getDb().then(function(db){ if(!db)return;
      GROUPS.forEach(function(_,g){ db.doc('results/g'+(g+1)).delete().catch(function(){}); db.doc('adjust/g'+(g+1)).delete().catch(function(){}); });
    });
    drawBoard();
  };
}

    '<div class="cols"><div><h3>الأهداف التعلّمية</h3><ul class="tidy"><li>تعرّف مفهوم المهارة.</li><li>تبيّن أهمية المهارة في النجاح وتحقيق الأهداف وسوق العمل.</li><li>تصنّف أنواع المهارات وتمثّل لها: تقنية، وتعلّم للحياة.</li><li>تمارس العمل التعاوني بأدوار متبادلة.</li></ul></div>'+
    '<div><h3>خطة الحصة (45 دقيقة)</h3><ul class="tidy"><li>0–5: تهيئة. سؤال: ما مهارة تتقنينها وكيف تعلّمتِها؟</li><li>5–8: تشكيل 6 مجموعات (4 + 4 + 4 + 4 + 5 + 5 = 26) وتوزيع الأرقام.</li><li>8–33: التحدّي، 5 مهمات.</li><li>33–40: عرض بطاقات الإنجاز وأمثلة المجموعات.</li><li>40–45: ختام وتذكرة خروج: «مهارتي القادمة التي سأطوّرها».</li></ul></div></div>'+
    '<div><h3>مهمات اللعبة ومستويات التفكير</h3><div class="scroll"><table><thead><tr><th>المهمة</th><th>المستوى</th><th>المطلوب</th><th>الوقت</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    '<div class="cols"><div><h3>التقويم أثناء اللعب</h3><ul class="tidy"><li>تمرّين بين المجموعات وراقبي من يتحدّث ومن يمسك التاب.</li><li>اسألي المقرّرة عن جملة الملخّص بعد كل مهمة.</li><li>اطلبي تبرير الإجابة قبل الضغط: «لماذا هذه المهارة تحديدًا؟»</li></ul></div>'+
    '<div><h3>ملاحظات تشغيل</h3><ul class="tidy"><li>تفتح كل مجموعة الرابط نفسه على تابها وتختار رقم مجموعتها.</li><li>لا تُرسل النقاط تلقائيًا. تسجّلها المعلّمة من بطاقة الإنجاز.</li><li>إذا أُغلقت الصفحة، تظهر «متابعة» عند فتحها مجددًا على الجهاز نفسه.</li><li>لإيقاف الصوت استخدمي زر السماعة أعلى الصفحة.</li></ul></div></div></section>';
}
